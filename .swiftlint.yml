# SwiftLint configuration of Temaster.
# scripts/lint.sh runs it before every build and fails the build above 3 violations.
# New code adds zero violations (see AGENTS.md). Do not relax these rules to make a build pass.

disabled_rules:
  # The app name, Temaster, contains "master", so every type named after the app (TemasterApp) would break it.
  - inclusive_language

included:
  - Temaster
  - Packages/TemasterData/Sources
  - Packages/TemasterData/Tests
  - Packages/TemasterUI/Sources
  - Packages/TemasterUI/Tests

excluded:
  - Packages/TemasterData/.build
  - Packages/TemasterUI/.build
  - DerivedData
  # Generated by scripts/codegen/design_tokens.py from tokens.json.
  - Packages/TemasterUI/Sources/TemasterUI/Tokens

line_length:
  warning: 120
  error: 160
  ignores_comments: true
  ignores_urls: true

identifier_name:
  min_length:
    warning: 3
    error: 2
  excluded:
    - id

type_body_length:
  warning: 250
  error: 400

file_length:
  warning: 400
  error: 600

function_body_length:
  warning: 50
  error: 80

reporter: xcode
